# Series registry. Each post joins a series by adding `series: <id>` (or a
# list of ids) to its frontmatter. Part numbers come from post dates, so you
# never write them by hand. Read by scripts/build_series.py before each render.
#
#   id:            used in post frontmatter and as the anchor on /series.html
#   title:         shown on the series page and in the box inside each post
#   section:       technical | personal
#   description:   one or two sentences for the series page
#   ongoing:       true while you're still adding posts (optional)

